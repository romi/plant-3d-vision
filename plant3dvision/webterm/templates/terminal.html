<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebTerm - Terminal</title>
    <!-- XTerm.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css">
    <!-- BootStrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/terminal.css">
    <!-- XTerm.js -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/toml/toml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
</head>
<body>
<header class="terminal-header">
    <div class="user-info">
        <span class="welcome-text">Welcome, {{ full_name }}</span>
        <span class="username">@{{ username }}</span>
    </div>
    <div class="actions">
        {% if username == 'admin' %}
        <a href="/admin" class="admin-button" title="Admin Panel">
            <i class="bi bi-shield-lock"></i>
        </a>
        {% endif %}
        <a href="/user/profile" class="profile-btn" title="User Profile">
            <i class="bi bi-person-circle"></i>
        </a>
        <button id="btn-fullscreen" title="Toggle Fullscreen">
            <i class="bi bi-arrows-fullscreen"></i>
        </button>
        <a href="/logout" class="logout-btn" title="Logout">
            <i class="bi bi-box-arrow-right"></i>
        </a>
    </div>
</header>

<div class="main-container">
    <div class="terminal-side">
        <div class="terminal-container">
            <div id="terminal"></div>
        </div>
    </div>

    <div class="resize-handle"></div>

    <div class="info-side">
        <div class="scan-list">
            <div class="section-header">
                <h2>Available Scan Datasets</h2>
                <button class="refresh-btn" id="refresh-scans">Refresh</button>
            </div>
            <div class="scan-grid" id="scan-datasets">
                <!-- JavaScript will populate scan datasets here -->
            </div>
        </div>

        <div class="toml-editor-section">
            <div class="section-header">
                <h2>TOML Configuration Editor</h2>
                <div class="toml-actions">
                    <button id="load-toml-btn" class="action-btn load-btn" title="Load TOML file">
                        <i class="bi bi-folder2-open"></i> Load
                    </button>
                    <div class="toml-filename-container">
                        <input type="text" id="toml-filename" placeholder="filename.toml" class="toml-filename-input">
                        <button id="save-toml-btn" class="save-btn">Save</button>
                    </div>
                </div>
            </div>
            <div id="toml-file-selector" class="file-selector hidden">
                <div class="file-selector-header">
                    <h3>Select TOML Configuration</h3>
                    <button id="close-file-selector" class="close-btn"><i class="bi bi-x"></i></button>
                </div>
                <div id="toml-files-list" class="files-list">
                    <!-- Files will be loaded here -->
                    <div class="loading-indicator">Loading files...</div>
                </div>
            </div>
            <div id="toml-editor-container" class="toml-editor-container">
                <div id="toml-editor"></div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/terminal.js"></script>
</body>
</html>
