{% extends "base.html" %}

{% block title %}WebTerm - Admin Panel{% endblock %}

{% block content %}
<!-- Container for login form and logo -->
<div class="form-container">
    <div class="content-box">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='img/ROMI_logo_green.svg') }}" alt="P3DV Logo">
        </div>
        <h1>Admin Panel</h1>

        <h3>Add New User</h3>
        <form id="addUserForm">
            <div class="input-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required autofocus>
            </div>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('password')">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>
            <div class="input-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-container">
                    <input type="password" id="confirm_password" name="confirm_password" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('confirm_password')">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>
            <button type="submit" class="primary-button">Add User</button>
        </form>

        <div class="nav-bar">
            <div>
                <a href="{{ url_for('webterm.terminal') }}"><i class="bi bi-terminal"></i> Back to Terminal</a>
                <br>
                <a href="{{ url_for('webterm.logout') }}"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>

        <div id="result" class="result" style="display: none;"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <!-- Custom JS for client-side functionality, loaded after the page is parsed -->
    <script src="{{ url_for('static', filename='js/admin.js') }}" defer></script>
{% endblock %}
