[build-system]
requires = ["setuptools >=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plant3dvision"
version = "0.13.2"
dependencies = [
    "pywavefront",
    "trimesh",
    "appdirs",
    "colorlog",
    "docker",
    "imageio>= 2.16.2",
    "imagecodecs",
    "pandas",
    "networkx",
    "open3d>= 0.9.0.0",
    "opencv-contrib-python",
    # "pybind11",
    # "pyopencl",
    "scikit-image",
    "toml",
    "joblib",
    "matplotlib",
    "dash",
    "dash-iconify",
    "nvidia-cuda-nvcc",
    "pycuda",
]
description = "3D reconstruction & quantification of single potted plants from RGB scans."
readme = "README.md"
requires-python = ">=3.8"
license = "LGPL-3.0-or-later"
authors = [
    { name = "Peter Hanappe", email = "peter.hanappe@sony.com" },
    { name = "Timothée Wintz", email = "timothee@timwin.fr" },
    { name = "Nabil Ait Taleb", email = "mohamednabil.aittaleb@sony.com" },
]
maintainers = [
    { name = "Jonathan Legrand", email = "jonathan.legrand@ens-lyon.fr" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
keywords = [
    "Robotics for Microfarms",
    "ROMI",
    "photogrammetry",
    "SfM",
    "COLMAP",
    "pipeline",
]

[project.scripts]
check_measures = "bin.check_measures:main"
colmap_poses = "bin.colmap_poses:main"
create_charuco_board = "bin.create_charuco_board:main"
volume_viewer = "bin.volume_viewer:main"
robustness_evaluation = "bin.robustness_evaluation:main"
voronoi_texture_generator = "bin.voronoi_texture_generator:main"
linear_filter = "plant3dvision.gui.linear_filter:main"
pcd_to_mesh = "plant3dvision.gui.pcd_to_mesh:main"

[project.urls]
homepage = "https://romi-project.eu/"
documentation = "https://docs.romi-project.eu/plant_imager/"
source = "https://github.com/romi/plant-3d-vision"
issues = "https://github.com/romi/plant-3d-vision/issues"

[project.optional-dependencies]
gui = ["pyqt6"]
doc = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions",
    "markdown-exec[ansi]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
]

webterm = [
    "flask",
    "flask-socketio",
    "eventlet",
    "bcrypt",
    "python-engineio",
    "python-socketio",
    "python-dotenv",
    "gunicorn",
    "eventlet"
]

[tool.setuptools.package-data]
plant3dvision = [
    "kernels/*.c",
    "kernels/*.h",
    "webterm/templates/*.html",
    "webterm/templates/**/*",
    "webterm/static/**/*.css",
    "webterm/static/**/*.js",
    "webterm/static/**/*.png",
    "webterm/static/**/*.svg",
    "webterm/static/**/*.ico"
]

[tool.setuptools.packages.find]
include = [
    "plant3dvision*",
    "romitask*",
    "plantdb/src/commons/*",
    "plantdb/src/client/*",
    "romicgal*",
    "romiseg*",
    "dtw*",
    "skeleton_refinement*"
]
