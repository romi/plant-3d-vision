[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "plant3dvision"
version = "0.13.1"
description = "3D reconstruction & quantification of single potted plants from RGB scans."
readme = "README.md"
license = { text = "LGPL-3.0" }
authors = [
    { name = "Timothée Wintz", email = "timothee@timwin.fr" }
]
maintainers = [
    { name = "Jonathan Legrand", email = "jonathan.legrand@ens-lyon.fr" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)"
]
keywords = [
    "Robotics for Microfarms",
    "ROMI",
    "photogrammetry",
    "SfM",
    "COLMAP",
    "pipeline",
]

requires-python = ">=3.8"
dependencies = [
    "pywavefront",
    "trimesh",
    "appdirs",
    "colorlog",
    "docker",
    "imageio>= 2.16.2",
    "imagecodecs",
    "pandas",
    "networkx",
    "open3d>= 0.9.0.0",
    "opencv-contrib-python",
    "pybind11",
    "pyopencl",
    "scikit-image",
    "toml",
    "joblib",
    "matplotlib",
    "dash",
    "dash-iconify",
]

[project.scripts]
check_measures = "bin.check_measures:main"
colmap_poses = "bin.colmap_poses:main"
create_charuco_board = "bin.create_charuco_board:main"
volume_viewer = "bin.volume_viewer:main"
robustness_evaluation = "bin.robustness_evaluation:main"
voronoi_texture_generator = "bin.voronoi_texture_generator:main"

[project.urls]
Homepage = "https://romi-project.eu/"
Documentation = "https://docs.romi-project.eu/plant_imager/"
Repository = "https://github.com/romi/plant-3d-vision"
Issues = "https://github.com/romi/plant-3d-vision/issues"

[project.optional-dependencies]
doc = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions",
    "markdown-exec[ansi]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
]

[tool.setuptools]
packages = [
    "romitask",
    "plantdb",
    "plant3dvision",
    "romicgal",
    "romiseg",
    "dtw",
    "skeleton_refinement",
]
include-package-data = true  # Includes files from MANIFEST.in