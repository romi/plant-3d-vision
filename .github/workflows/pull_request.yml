# This workflow will build the Docker image, run python unit tests and integration tests

name: CI

on: pull_request

jobs:

  docker-clean-before:
    runs-on: self-hosted
    steps:
      - name: Clean old Docker containers
        run: |
          docker container prune -f

  docker-build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build Dockerfile
        run: |
          ./docker/build.sh -t ${{ github.sha }} --no-cache --plain

  unit-tests:
    runs-on: self-hosted
    needs: docker-build
    steps:
      - name: Run Unit Tests
        run: |
          ./docker/run.sh -t ${{ github.sha }} --unittest

  integration-tests:
    runs-on: self-hosted
    needs: docker-build
    steps:
      - name: Run Integration Tests
        run: |
          ./docker/run.sh -t ${{ github.sha }} --test-integration

  docker-clean:
    runs-on: self-hosted
    needs: [ integration-tests, unit-tests ]
    if: always()
    steps:
      - name: Remove Docker Image
        run: |
          docker image rm roboticsmicrofarms/plant-3d-vision:${{ github.sha }} --force
          docker container prune -f
          docker image prune --filter label=stage=builder -f