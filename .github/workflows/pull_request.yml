# This workflow will build the Docker image, run python unit tests and integration tests

name: CI

env:
  COLMAP: 3.13.0

on: pull_request

jobs:

  colmap-docker-build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Pull existing Colmap image (if any)
        id: pull_colmap_image
        run: |
          COLMAP_TAG=$(./docker/colmap_tag.sh ${COLMAP} | tail -n 1)
          echo "COLMAP_TAG=${COLMAP_TAG}" >> "$GITHUB_ENV"
          echo "Using colmap image tag: ${COLMAP_TAG}"
          echo "Using colmap image: roboticsmicrofarms/colmap:${COLMAP_TAG}"
          docker pull roboticsmicrofarms/colmap:${COLMAP_TAG}
        continue-on-error: true   # do not fail the job if image is missing
      - name: Set up Docker Buildx
        if: steps.pull_colmap_image.outcome != 'success'   # skip when image was pulled
        uses: docker/setup-buildx-action@v3
      - name: Build Dockerfile
        if: steps.pull_colmap_image.outcome != 'success'   # skip when image was pulled
        run: |
          ./docker/colmap${COLMAP}/build.sh -t ${COLMAP_TAG} --plain --load
      - name: Log in to Docker Hub
        if: steps.pull_colmap_image.outcome != 'success'   # log in to push only after a fresh build
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Colmap image
        if: steps.pull_colmap_image.outcome != 'success'   # push only after a fresh build
        run: |
          docker push roboticsmicrofarms/colmap:${COLMAP_TAG}

  p3dv-devel-docker-build:
    runs-on: self-hosted
    needs: colmap-docker-build
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Pull existing Colmap image (if any)
        run: |
          COLMAP_TAG=$(./docker/colmap_tag.sh ${COLMAP} | tail -n 1)
          echo "COLMAP_TAG=${COLMAP_TAG}" >> "$GITHUB_ENV"
          echo "Using colmap image tag: ${COLMAP_TAG}"
          echo "Using colmap image: roboticsmicrofarms/colmap:${COLMAP_TAG}"
          docker pull roboticsmicrofarms/colmap:${COLMAP_TAG}
        continue-on-error: false   # fail the job if image is missing
      - name: Pull existing p3dv-devel image (if any)
        id: pull_p3dv_image
        run: |
          P3DV_TAG=colmap${COLMAP_TAG}
          echo "P3DV_TAG=${P3DV_TAG}" >> "$GITHUB_ENV"
          echo "Using p3dv-devel image tag: ${P3DV_TAG}"
          echo "Using p3dv-devel image: roboticsmicrofarms/p3dv-devel:${P3DV_TAG}"
          docker pull roboticsmicrofarms/p3dv-devel:${P3DV_TAG}
        continue-on-error: true   # do not fail the job if image is missing
      - name: Set up Docker Buildx
        if: steps.pull_p3dv_image.outcome != 'success'   # skip when image was pulled
        uses: docker/setup-buildx-action@v3
      - name: Build Dockerfile
        if: steps.pull_p3dv_image.outcome != 'success'   # skip when image was pulled
        run: |
          ./docker/p3dv-devel/build.sh -t ${P3DV_TAG} --colmap ${COLMAP} --plain --load
      - name: Log in to Docker Hub
        if: steps.pull_p3dv_image.outcome != 'success'   # log in to push only after a fresh build
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push p3dv-devel image
        if: steps.pull_p3dv_image.outcome != 'success'   # push only after a fresh build
        run: |
          docker push roboticsmicrofarms/p3dv-devel:${P3DV_TAG}

  unit-tests:
    runs-on: self-hosted
    needs: p3dv-devel-docker-build
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Pull existing p3dv-devel image
        run: |
          COLMAP_TAG=$(./docker/colmap_tag.sh ${COLMAP} | tail -n 1)
          P3DV_TAG=colmap${COLMAP_TAG}
          echo "P3DV_TAG=${P3DV_TAG}" >> "$GITHUB_ENV"
          echo "Using p3dv-devel image tag: ${P3DV_TAG}"
          echo "Using colmap image: roboticsmicrofarms/p3dv-devel:${P3DV_TAG}"
          docker pull roboticsmicrofarms/p3dv-devel:${P3DV_TAG}
        continue-on-error: false   # fail the job if image is missing
      - name: Run Unit Tests
        run: |
          ./docker/p3dv-devel/run.sh -t ${P3DV_TAG} --unittest

  integration-tests:
    runs-on: self-hosted
    needs: p3dv-devel-docker-build
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Pull existing p3dv-devel image
        run: |
          COLMAP_TAG=$(./docker/colmap_tag.sh ${COLMAP} | tail -n 1)
          P3DV_TAG=colmap${COLMAP_TAG}
          echo "P3DV_TAG=${P3DV_TAG}" >> "$GITHUB_ENV"
          echo "Using p3dv-devel image tag: ${P3DV_TAG}"
          echo "Using colmap image: roboticsmicrofarms/p3dv-devel:${P3DV_TAG}"
          docker pull roboticsmicrofarms/p3dv-devel:${P3DV_TAG}
        continue-on-error: false   # fail the job if image is missing
      - name: Run Integration Tests
        run: |
          ./docker/p3dv-devel/run.sh -t ${P3DV_TAG} --test-integration
