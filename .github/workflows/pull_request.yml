# This workflow will build the Docker image, run python unit tests and integration tests

name: CI

on: pull_request

jobs:

  colmap-docker-build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      # Define the `env.TAG` to use with './docker/colmap_tag.sh', then try to pull it
      - name: Pull existing Colmap image (if any)
        id: pull_image
        run: |
          ./docker/colmap_tag.sh 3.8
          docker pull roboticsmicrofarms/colmap:${{ env.TAG }}
        continue-on-error: true   # do not fail the job if image is missing
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Dockerfile
        if: steps.pull_image.outcome != 'success'   # skip when image was pulled
        run: |
          ./docker/colmap3.8/build.sh --plain --load
      - name: Log in to Docker Hub
        if: steps.pull_image.outcome != 'success'   # log in to push only after a fresh build
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Colmap image
        if: steps.pull_image.outcome != 'success'   # push only after a fresh build
        run: |
          docker push roboticsmicrofarms/colmap:${{ env.TAG }}

  p3dv-docker-build:
    runs-on: self-hosted
    needs: colmap-docker-build
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      # Define the `env.TAG` to use with './docker/colmap_tag.sh', then try to pull it
      - name: Pull existing Colmap image (if any)
        run: |
          ./docker/colmap_tag.sh 3.8
          docker pull roboticsmicrofarms/colmap:${{ env.TAG }}
        continue-on-error: false   # fail the job if image is missing
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Dockerfile
        run: |
          ./docker/build.sh -t ${{ github.sha }} --no-cache --plain --load
      - name: Save Docker image to tar
        run: |
          docker save -o plant-3d-vision-${{ github.sha }}.tar roboticsmicrofarms/plant-3d-vision:${{ github.sha }}
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: plant-3d-vision-image
          path: plant-3d-vision-${{ github.sha }}.tar

  unit-tests:
    runs-on: self-hosted
    needs: p3dv-docker-build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: plant-3d-vision-image
          path: .
      - name: Load Docker image
        run: |
          docker load -i plant-3d-vision-${{ github.sha }}.tar
      - name: Run Unit Tests
        run: |
          ./docker/run.sh -t ${{ github.sha }} --unittest

  integration-tests:
    runs-on: self-hosted
    needs: p3dv-docker-build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: plant-3d-vision-image
          path: .
      - name: Load Docker image
        run: |
          docker load -i plant-3d-vision-${{ github.sha }}.tar
      - name: Run Integration Tests
        run: |
          ./docker/run.sh -t ${{ github.sha }} --test-integration

  docker-clean:
    runs-on: self-hosted
    needs: [ integration-tests, unit-tests ]
    if: always()
    steps:
      - name: Remove Docker Image
        run: |
          docker image rm roboticsmicrofarms/plant-3d-vision:${{ github.sha }} --force
          docker container prune -f
          docker image prune --filter label=stage=builder -f