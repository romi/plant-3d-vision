x-runner-base: &runner-base
  build:
    context: .
    dockerfile: Dockerfile

  image: self-hosted-runner:latest
  restart: always

  group_add:
    - "${DOCKER_GID:-984}"  # the mounted docker socket group id (GID)

  deploy:
    resources:
      reservations:
        cpus: 4
        memory: 8G
        devices:
          - driver: nvidia
            capabilities: [gpu]
            count: 1

  security_opt:
    - no-new-privileges:true

  cap_drop:
    - ALL
  # Add only necessary capabilities
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID

  tmpfs:
    - /tmp:noexec,nosuid,nodev
    - /run:noexec,nosuid,nodev

volumes:
  docker-cache:
    driver: local
    driver_opts:
      # Set the ownership of the volume to the runner user (UID 1000, GID 1000)
      o: uid=1000,gid=1000
  runner1-work:
    driver: local
    driver_opts:
      # Set the ownership of the volume to the runner user (UID 1000, GID 1000)
      o: uid=1000,gid=1000
  runner2-work:
    driver: local
    driver_opts:
      # Set the ownership of the volume to the runner user (UID 1000, GID 1000)
      o: uid=1000,gid=1000
  runner3-work:
    driver: local
    driver_opts:
      # Set the ownership of the volume to the runner user (UID 1000, GID 1000)
      o: uid=1000,gid=1000
  runner4-work:
    driver: local
    driver_opts:
      # Set the ownership of the volume to the runner user (UID 1000, GID 1000)
      o: uid=1000,gid=1000

services:
  runner1:
    <<: *runner-base
    container_name: romi-github-runner-1
    environment:
      - GITHUB_RUNNER_EPHEMERAL=true
      - GITHUB_RUNNER_URL=${GITHUB_RUNNER_URL}
      - GITHUB_RUNNER_TOKEN=${GITHUB_RUNNER_TOKEN_1}
      - GITHUB_RUNNER_LABELS=${GITHUB_RUNNER_LABELS:-self-hosted,linux,docker,x64,gpu}
      - GITHUB_RUNNER_NAME=romi-github-runner-1
    volumes:
      - ${DOCKER_SOCK:-$XDG_RUNTIME_DIR/docker.sock}:/var/run/docker.sock
      - runner1-work:/actions-runner/_work
      - docker-cache:/home/ubuntu/.docker

  runner2:
    <<: *runner-base
    container_name: romi-github-runner-2
    environment:
      - GITHUB_RUNNER_EPHEMERAL=true
      - GITHUB_RUNNER_URL=${GITHUB_RUNNER_URL}
      - GITHUB_RUNNER_TOKEN=${GITHUB_RUNNER_TOKEN_2}
      - GITHUB_RUNNER_LABELS=${GITHUB_RUNNER_LABELS:-self-hosted,linux,docker,x64,gpu}
      - GITHUB_RUNNER_NAME=romi-github-runner-2
    volumes:
      - ${DOCKER_SOCK:-$XDG_RUNTIME_DIR/docker.sock}:/var/run/docker.sock
      - runner2-work:/actions-runner/_work
      - docker-cache:/home/ubuntu/.docker

  runner3:
