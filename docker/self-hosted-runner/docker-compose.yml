services:

  runner:
    build:
      context: .
      dockerfile: Dockerfile

    image: self-hosted-runner:latest
    container_name: romi-github-runner

    restart: always

    # Add the group ID that owns the Docker socket
    group_add:
      - "${DOCKER_SOCKET_GID:-1000}"

    volumes:
      # Mount the host's Docker socket (DooD approach)
      - ${DOCKER_SOCK:-/run/user/1000/docker.sock}:/var/run/docker.sock
      # Runner work directory
      - runner-cache:/actions-runner/_work
      # Optional: share Docker build cache for faster builds
      - docker-cache:/home/ubuntu/.docker

    environment:
      - GITHUB_RUNNER_EPHEMERAL=true
      - GITHUB_RUNNER_URL=${GITHUB_RUNNER_URL}
      - GITHUB_RUNNER_TOKEN=${GITHUB_RUNNER_TOKEN}
      - GITHUB_RUNNER_LABELS=${GITHUB_RUNNER_LABELS:-self-hosted,linux,docker,x64,gpu}
      - GITHUB_RUNNER_NAME=${GITHUB_RUNNER_NAME:-romi-github-runner}

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # Add only necessary capabilities
    cap_add:
      - SYS_ADMIN
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    read_only: true

    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /run:noexec,nosuid,nodev

volumes:
  runner-cache:
  docker-cache: